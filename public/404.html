<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketFlow</title>
    <script>
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var target = '/?p=' + encodeURIComponent(pathname + search + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #94a3b8; background: #0f172a;">
      <p>Redirecting to application...</p>
    </div>
  </body>
</html>
